<!doctype html>
<html lang='ru'>
<head>
  <meta charset='utf-8'>
  <title>Угадай число</title>
</head>
<body>
  <h1>Угадай число</h1>
  <p id='greeting'>Загрузка…</p>
  <input id='guess' type='number'>
  <button id='check'>Проверить</button>
  <p id='answer'></p>
  <script>
    fetch('game.json').then(r => r.json()).then(game => {
      const mode = game.modes.classic;
      const secret = mode.min + Math.floor(Math.random() * (mode.max - mode.min + 1));
      document.getElementById('greeting').textContent = game.greeting;
      document.getElementById('check').onclick = () => {
        const n = Number(document.getElementById('guess').value);
        const out = document.getElementById('answer');
        if (n < secret) out.textContent = mode.higher;
        else if (n > secret) out.textContent = mode.lower;
        else out.textContent = mode.win;
      };
    });
  </script>
</body>
</html>
